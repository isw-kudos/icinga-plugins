name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './plugins/bash'

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install "ruff>=0.4.0"
      - name: Run ruff
        run: |
          if find plugins/python -name "*.py" | grep -q .; then
            ruff check plugins/python/
          else
            echo "No Python files found, skipping ruff"
          fi
