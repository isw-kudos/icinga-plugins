// check_isds_replication - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_replication/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Requires the "isds-replication" service template - see service_template.conf.
// Deployed as part of the ISDS set: servicesets/isds/services.conf.

apply Service "isds-replication" {
  import "isds-replication"

  vars.isds_repl_host     = host.vars.isds_ldap_host
  vars.isds_repl_port     = host.vars.isds_ldap_port
  vars.isds_repl_binddn   = host.vars.isds_ldap_binddn
  vars.isds_repl_passfile = host.vars.isds_ldap_passfile
  vars.isds_repl_base     = host.vars.isds_repl_base

  assign where host.vars.isds == true
}
