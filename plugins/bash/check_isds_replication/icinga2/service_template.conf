// check_isds_replication - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_replication/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Replication backlog and state change more slowly than worker exhaustion, so
// every two minutes is enough.

template Service "isds-replication" {
  check_command = "check_isds_replication"

  check_interval = 2m
  retry_interval = 1m
  max_check_attempts = 3

  // The IBM LDAP client and the bind password file exist only on the SDS host,
  // so the check runs on the agent there and talks to the server on loopback.
  command_endpoint = host.name
}
