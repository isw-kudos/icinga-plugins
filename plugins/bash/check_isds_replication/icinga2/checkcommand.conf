// check_isds_replication - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_replication/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_isds_replication" {
  command = [ PluginDir + "/check_isds_replication" ]

  arguments = {
    "-H" = {
      value       = "$isds_repl_host$"
      description = "LDAP host/IP (default: 127.0.0.1)"
    }
    "-p" = {
      value       = "$isds_repl_port$"
      description = "LDAP port (default: 389)"
    }
    "--ldaps" = {
      set_if      = "$isds_repl_ldaps$"
      description = "Use ldaps://"
    }
    "-Z" = {
      set_if      = "$isds_repl_starttls$"
      description = "Use StartTLS on the plain port"
    }
    "-D" = {
      value       = "$isds_repl_binddn$"
      description = "Bind DN (read-only replication monitor account)"
    }
    "-y" = {
      value       = "$isds_repl_passfile$"
      description = "File containing the bind password (preferred over -W)"
    }
    "--ldapsearch-bin" = {
      value       = "$isds_repl_ldapsearch_bin$"
      description = "Absolute path to idsldapsearch/ldapsearch (auto-detected if unset)"
    }
    "--ldap-flavor" = {
      value       = "$isds_repl_ldap_flavor$"
      description = "Force ibm or openldap flag syntax (auto-detected if unset)"
    }
    "--key-file" = {
      value       = "$isds_repl_key_file$"
      description = "IBM SSL key database (.kdb) for --ldaps"
    }
    "--key-pw" = {
      value       = "$isds_repl_key_pw$"
      description = "IBM SSL key database password/stash for --ldaps"
    }
    "-b" = {
      value       = "$isds_repl_base$"
      description = "Search base for replication agreements (required)"
      required    = true
    }
    "--repl-base" = {
      value       = "$isds_repl_repl_base$"
      description = "Optional sub-tree under -b to search instead"
    }
    "--agreement" = {
      value       = "$isds_repl_agreement$"
      description = "Only check the agreement(s) with this cn (array)"
      repeat_key  = true
    }
    "-w" = {
      value       = "$isds_repl_pending_warn$"
      description = "Warn when pending changes >= N"
    }
    "-c" = {
      value       = "$isds_repl_pending_crit$"
      description = "Crit when pending changes >= N"
    }
    "--lag-warn" = {
      value       = "$isds_repl_lag_warn$"
      description = "Warn when last-change age >= seconds (default: off)"
    }
    "--lag-crit" = {
      value       = "$isds_repl_lag_crit$"
      description = "Crit when last-change age >= seconds (default: off)"
    }
    "-t" = {
      value       = "$isds_repl_timeout$"
      description = "Timeout in seconds (default: 30)"
    }
  }

  vars.isds_repl_host         = "$address$"
  vars.isds_repl_port         = 389
  vars.isds_repl_pending_warn = 100
  vars.isds_repl_pending_crit = 1000
  vars.isds_repl_timeout      = 30
}
