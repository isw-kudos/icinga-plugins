// check_domino_mail - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_domino_mail/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "check_domino_mail" {
  check_command = "check_domino_mail"

  vars.check_domino_mail_host              = host.vars.check_domino_mail_host
  vars.check_domino_mail_nrpc_port         = host.vars.check_domino_mail_nrpc_port
  vars.check_domino_mail_smtp_port         = host.vars.check_domino_mail_smtp_port
  vars.check_domino_mail_http_url          = host.vars.check_domino_mail_http_url
  vars.check_domino_mail_http_expect       = host.vars.check_domino_mail_http_expect
  vars.check_domino_mail_timeout           = host.vars.check_domino_mail_timeout
  vars.check_domino_mail_handshake_timeout = host.vars.check_domino_mail_handshake_timeout
  vars.check_domino_mail_cmd_timeout       = host.vars.check_domino_mail_cmd_timeout
  vars.check_domino_mail_no_status         = host.vars.check_domino_mail_no_status
  vars.check_domino_mail_no_nrpc_tcp       = host.vars.check_domino_mail_no_nrpc_tcp
  vars.check_domino_mail_no_nrpc_handshake = host.vars.check_domino_mail_no_nrpc_handshake
  vars.check_domino_mail_no_show_server    = host.vars.check_domino_mail_no_show_server
  vars.check_domino_mail_no_nrpc_trace     = host.vars.check_domino_mail_no_nrpc_trace
  vars.check_domino_mail_no_smtp           = host.vars.check_domino_mail_no_smtp
  vars.check_domino_mail_no_http           = host.vars.check_domino_mail_no_http

  assign where host.vars.check_domino_mail == true
  // or: assign where "domino-mail-host" in host.templates
}
