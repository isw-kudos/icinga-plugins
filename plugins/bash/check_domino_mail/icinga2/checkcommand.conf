// check_domino_mail - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_domino_mail/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_domino_mail" {
  command = [ PluginDir + "/check_domino_mail" ]

  arguments = {
    "-H" = {
      value       = "$check_domino_mail_host$"
      description = "Host/IP to probe (default: 127.0.0.1 — run on the Domino host itself)"
    }
    "--nrpc-port" = {
      value       = "$check_domino_mail_nrpc_port$"
      description = "NRPC port (default: 1352)"
    }
    "--smtp-port" = {
      value       = "$check_domino_mail_smtp_port$"
      description = "SMTP port (default: 25)"
    }
    "--http-url" = {
      value       = "$check_domino_mail_http_url$"
      description = "HTTP URL to probe"
    }
    "--http-expect" = {
      value       = "$check_domino_mail_http_expect$"
      description = "Expected substring in HTTP response body (default: Domino)"
    }
    "-t" = {
      value       = "$check_domino_mail_timeout$"
      description = "Per network-probe timeout in seconds (default: 10)"
    }
    "--handshake-timeout" = {
      value       = "$check_domino_mail_handshake_timeout$"
      description = "NRPC handshake timeout in seconds (default: 5)"
    }
    "--cmd-timeout" = {
      value       = "$check_domino_mail_cmd_timeout$"
      description = "'domino cmd' timeout in seconds (default: 20)"
    }
    "--no-status" = {
      set_if      = "$check_domino_mail_no_status$"
      description = "Disable the 'domino status' sub-check"
    }
    "--no-nrpc-tcp" = {
      set_if      = "$check_domino_mail_no_nrpc_tcp$"
      description = "Disable the NRPC TCP-connect sub-check"
    }
    "--no-nrpc-handshake" = {
      set_if      = "$check_domino_mail_no_nrpc_handshake$"
      description = "Disable the NRPC byte-flow handshake sub-check"
    }
    "--no-show-server" = {
      set_if      = "$check_domino_mail_no_show_server$"
      description = "Disable the 'show server' console sub-check"
    }
    "--no-nrpc-trace" = {
      set_if      = "$check_domino_mail_no_nrpc_trace$"
      description = "Disable the NRPC end-to-end trace sub-check"
    }
    "--no-smtp" = {
      set_if      = "$check_domino_mail_no_smtp$"
      description = "Disable the SMTP sub-check"
    }
    "--no-http" = {
      set_if      = "$check_domino_mail_no_http$"
      description = "Disable the HTTP sub-check"
    }
  }

  vars.check_domino_mail_host              = "127.0.0.1"
  vars.check_domino_mail_nrpc_port         = 1352
  vars.check_domino_mail_smtp_port         = 25
  vars.check_domino_mail_http_url          = "http://127.0.0.1/names.nsf?OpenDatabase"
  vars.check_domino_mail_http_expect       = "Domino"
  vars.check_domino_mail_timeout           = 10
  vars.check_domino_mail_handshake_timeout = 5
  vars.check_domino_mail_cmd_timeout       = 20
  vars.check_domino_mail_no_status         = false
  vars.check_domino_mail_no_nrpc_tcp       = false
  vars.check_domino_mail_no_nrpc_handshake = false
  vars.check_domino_mail_no_show_server    = false
  vars.check_domino_mail_no_nrpc_trace     = false
  vars.check_domino_mail_no_smtp           = false
  vars.check_domino_mail_no_http           = false
}
