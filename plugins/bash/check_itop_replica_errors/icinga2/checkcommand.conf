// check_itop_replica_errors - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_replica_errors/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// The baselines live here, in the Icinga configuration, rather than in a state
// file on the agent. That keeps one authoritative record of what "normal" is,
// reviewable in version control, instead of a number that quietly rewrites
// itself and absorbs the next regression.
//
// There is no password argument by design - point itop_db_defaults_file at a
// mode 0600 my.cnf.

object CheckCommand "check_itop_replica_errors" {
  command = [ PluginDir + "/check_itop_replica_errors" ]

  arguments = {
    "-H" = {
      value       = "$itop_db_host$"
      description = "Database host"
    }
    "-P" = {
      value       = "$itop_db_port$"
      description = "Database port"
    }
    "-d" = {
      value       = "$itop_db_name$"
      description = "Database name"
    }
    "-u" = {
      value       = "$itop_db_user$"
      description = "Database user (omit if the defaults file supplies it)"
    }
    "--defaults-file" = {
      value       = "$itop_db_defaults_file$"
      description = "my.cnf-style file holding the read-only credentials (mode 0600)"
    }
    "--baseline" = {
      value       = "$itop_replica_errors_baseline$"
      description = "Known-good error count per source, e.g. '1=39,2=132'"
    }
    "--baseline-default" = {
      value       = "$itop_replica_errors_baseline_default$"
      description = "Baseline for a source not named in --baseline"
    }
    "--ignore-source" = {
      value       = "$itop_replica_errors_ignore_sources$"
      description = "Comma-separated source ids to skip; use for sources that are dead by design"
    }
    "-w" = {
      value       = "$itop_replica_errors_warning$"
      description = "Warning threshold: how far above baseline counts"
    }
    "-c" = {
      value       = "$itop_replica_errors_critical$"
      description = "Critical threshold above baseline; leave unset to never go CRITICAL"
    }
    "-t" = {
      value       = "$itop_db_timeout$"
      description = "Query timeout in seconds"
    }
  }

  vars.itop_db_host                            = "127.0.0.1"
  vars.itop_db_port                            = 3306
  vars.itop_db_name                            = "itop"
  vars.itop_db_timeout                         = 30
  vars.itop_replica_errors_baseline_default    = 0
  vars.itop_replica_errors_warning             = 1

  // itop_replica_errors_critical is intentionally unset: a synchro fault is
  // rated WARNING, and a CRITICAL default would impose a severity nobody chose.
}
