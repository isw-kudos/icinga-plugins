// check_itop_replica_errors - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_replica_errors/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Hourly. This is the level-based counterpart to the estate's edge-triggered
// sync-health cron job: it reports the current count every poll, so the alert
// persists for as long as the fault does instead of firing once on the change.

template Service "itop-replica-errors" {
  check_command = "check_itop_replica_errors"

  check_interval = 1h
  retry_interval = 15m
  max_check_attempts = 2

  command_endpoint = host.name
}
