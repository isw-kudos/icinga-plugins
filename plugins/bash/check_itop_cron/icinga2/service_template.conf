// check_itop_cron - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_cron/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Hourly, matching the threshold: the check asks whether anything has been
// waiting more than --stale-hours, so polling faster than that cannot make it
// notice a stall any sooner.

template Service "itop-cron" {
  check_command = "check_itop_cron"

  check_interval = 1h
  retry_interval = 15m
  max_check_attempts = 2

  // The database is reached on loopback from the iTop host, so the check runs
  // on the agent rather than the master.
  command_endpoint = host.name
}
