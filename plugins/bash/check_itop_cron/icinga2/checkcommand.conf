// check_itop_cron - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_cron/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// The database connection vars are deliberately named itop_db_* rather than
// itop_cron_*, so that all three iTop SQL checks share one set of credentials
// defined once on the host - see servicesets/itop/host_template.conf.
//
// There is no password argument by design. Point itop_db_defaults_file at a
// mode 0600 my.cnf: a password passed on the command line is visible in the
// process list to every user on the box.

object CheckCommand "check_itop_cron" {
  command = [ PluginDir + "/check_itop_cron" ]

  arguments = {
    "-H" = {
      value       = "$itop_db_host$"
      description = "Database host"
    }
    "-P" = {
      value       = "$itop_db_port$"
      description = "Database port"
    }
    "-d" = {
      value       = "$itop_db_name$"
      description = "Database name"
    }
    "-u" = {
      value       = "$itop_db_user$"
      description = "Database user (omit if the defaults file supplies it)"
    }
    "--defaults-file" = {
      value       = "$itop_db_defaults_file$"
      description = "my.cnf-style file holding the read-only credentials (mode 0600)"
    }
    "--stale-hours" = {
      value       = "$itop_cron_stale_hours$"
      description = "How far past due a task must be before it counts"
    }
    "--planned-column" = {
      value       = "$itop_cron_planned_column$"
      description = "Column holding the scheduled time; 'planned' or 'planned_date' depending on iTop version"
    }
    "-w" = {
      value       = "$itop_cron_warning$"
      description = "Warning threshold, overdue task count"
    }
    "-c" = {
      value       = "$itop_cron_critical$"
      description = "Critical threshold, overdue task count; leave unset to never go CRITICAL"
    }
    "-t" = {
      value       = "$itop_cron_timeout$"
      description = "Query timeout in seconds"
    }
  }

  vars.itop_db_host             = "127.0.0.1"
  vars.itop_db_port             = 3306
  vars.itop_db_name             = "itop"
  vars.itop_cron_stale_hours    = 1
  vars.itop_cron_planned_column = "planned"
  vars.itop_cron_warning        = 1
  vars.itop_cron_timeout        = 30

  // itop_cron_critical is intentionally left unset: the source runbook rates a
  // stalled queue as WARNING, and defining it here would make every deployment
  // inherit a CRITICAL nobody chose.
}
