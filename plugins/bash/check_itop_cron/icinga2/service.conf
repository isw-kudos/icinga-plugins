// check_itop_cron - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_cron/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Requires the "itop-cron" service template - see service_template.conf.
// Deployed as part of the iTop set: servicesets/itop/services.conf.

apply Service "itop-cron" {
  import "itop-cron"

  vars.itop_db_host             = host.vars.itop_db_host
  vars.itop_db_port             = host.vars.itop_db_port
  vars.itop_db_name             = host.vars.itop_db_name
  vars.itop_db_user             = host.vars.itop_db_user
  vars.itop_db_defaults_file    = host.vars.itop_db_defaults_file
  vars.itop_cron_stale_hours    = host.vars.itop_cron_stale_hours
  vars.itop_cron_planned_column = host.vars.itop_cron_planned_column

  assign where host.vars.itop == true
}
