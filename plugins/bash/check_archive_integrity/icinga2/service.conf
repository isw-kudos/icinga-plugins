// check_archive_integrity - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_archive_integrity/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Requires the "archive-integrity" service template - see service_template.conf.
// For the iTop backup instance of this check, see servicesets/itop/services.conf.

apply Service "archive-integrity" {
  import "archive-integrity"

  vars.archive_integrity_path            = host.vars.archive_integrity_path
  vars.archive_integrity_pattern         = host.vars.archive_integrity_pattern
  vars.archive_integrity_sidecar_ext     = host.vars.archive_integrity_sidecar_ext
  vars.archive_integrity_min_age_seconds = host.vars.archive_integrity_min_age_seconds

  assign where host.vars.archive_integrity_path != ""
  // or: assign where host.vars.archive_integrity == true
}
