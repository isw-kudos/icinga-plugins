// check_archive_integrity - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_archive_integrity/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// NOTE: backup archives are commonly mode 600 in a mode 700 directory. If the
// Icinga agent does not run as root, invoke the plugin via sudo instead - see
// INSTALL.md - e.g.:
//   command = [ "sudo", PluginDir + "/check_archive_integrity" ]

object CheckCommand "check_archive_integrity" {
  command = [ PluginDir + "/check_archive_integrity" ]

  arguments = {
    "-p" = {
      value       = "$archive_integrity_path$"
      description = "Directory to look in (not recursive)"
      required    = true
    }
    "--pattern" = {
      value       = "$archive_integrity_pattern$"
      description = "Filename glob, e.g. 'itop-db-*.sql.gz' (must not contain '/')"
      required    = true
    }
    "--sidecar-ext" = {
      value       = "$archive_integrity_sidecar_ext$"
      description = "Checksum sidecar suffix appended to the archive name; empty string skips the check"
    }
    "--min-age-seconds" = {
      value       = "$archive_integrity_min_age_seconds$"
      description = "Never test an archive younger than this, because it may still be being written"
    }
    "-t" = {
      value       = "$archive_integrity_timeout$"
      description = "Timeout in seconds for the decompression test (reads the whole archive)"
    }
  }

  vars.archive_integrity_sidecar_ext     = ".sha256"
  vars.archive_integrity_min_age_seconds = 300
  vars.archive_integrity_timeout         = 300
}
