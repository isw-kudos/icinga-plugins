// check_archive_integrity - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_archive_integrity/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Polled daily, not hourly: the decompression test reads the whole archive, so
// on a large dump it is the most expensive check in the set. Correctness does
// not depend on when it runs - --min-age-seconds keeps it off a half-written
// file regardless of scheduling.

template Service "archive-integrity" {
  check_command = "check_archive_integrity"

  check_interval = 24h
  retry_interval = 1h
  max_check_attempts = 2

  // Reading the archive takes as long as it takes; give the check room.
  check_timeout = 10m

  // The archives are local to the node that holds them.
  command_endpoint = host.name
}
