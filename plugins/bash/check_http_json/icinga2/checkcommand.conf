// check_http_json - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_http_json/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_http_json" {
  command = [ PluginDir + "/check_http_json" ]

  arguments = {
    "-U" = {
      value       = "$http_json_url$"
      description = "Target URL (e.g. https://host/route.id)"
      required    = true
    }
    "--expect" = {
      value       = "$http_json_expect$"
      description = "Field check '<jq-path>=<expected>', e.g. '.route=lhss' (repeatable, at least one required)"
      repeat_key  = true
      required    = true
    }
    "--header" = {
      value       = "$http_json_headers$"
      description = "Custom request header, e.g. 'host: social.example.com' (repeatable)"
      repeat_key  = true
    }
    "-k" = {
      set_if      = "$http_json_insecure$"
      description = "Skip TLS certificate verification"
    }
    "-t" = {
      value       = "$http_json_timeout$"
      description = "Timeout in seconds (default: 30)"
    }
  }

  vars.http_json_timeout  = 30
  vars.http_json_insecure = false
}
