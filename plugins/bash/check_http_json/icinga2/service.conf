// check_http_json - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_http_json/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "http-json" {
  check_command = "check_http_json"

  vars.http_json_url      = host.vars.http_json_url
  vars.http_json_expect   = host.vars.http_json_expect
  vars.http_json_headers  = host.vars.http_json_headers
  vars.http_json_insecure = host.vars.http_json_insecure
  vars.http_json_timeout  = host.vars.http_json_timeout

  check_interval = 1m
  retry_interval = 30s

  assign where host.vars.http_json == true
}
