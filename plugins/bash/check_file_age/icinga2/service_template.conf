// check_file_age - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_file_age/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Carries the scheduling and notification behaviour that is the same wherever
// this check is used, so an apply rule only has to supply the path and pattern.
// A freshness check is a level check against a slow-moving fact, so it is polled
// hourly rather than by the minute - see INSTALL.md.

template Service "file-age" {
  check_command = "check_file_age"

  check_interval = 1h
  retry_interval = 10m
  max_check_attempts = 2

  // The directory is local to the node holding the files, so the check runs on
  // the agent rather than the master.
  command_endpoint = host.name
}
