// check_file_age - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_file_age/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Requires the "file-age" service template - see service_template.conf.
// For the iTop backup instance of this check, see servicesets/itop/services.conf.

apply Service "file-age" {
  import "file-age"

  vars.file_age_path      = host.vars.file_age_path
  vars.file_age_pattern   = host.vars.file_age_pattern
  vars.file_age_warning   = host.vars.file_age_warning
  vars.file_age_critical  = host.vars.file_age_critical
  vars.file_age_min_bytes = host.vars.file_age_min_bytes

  assign where host.vars.file_age_path != ""
  // or: assign where host.vars.file_age == true
}
