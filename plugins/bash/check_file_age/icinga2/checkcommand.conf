// check_file_age - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_file_age/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// NOTE: the directory being watched is often readable only by root - a backup
// directory is typically mode 700. If the Icinga agent does not run as root,
// invoke the plugin via sudo instead - see INSTALL.md - e.g.:
//   command = [ "sudo", PluginDir + "/check_file_age" ]

object CheckCommand "check_file_age" {
  command = [ PluginDir + "/check_file_age" ]

  arguments = {
    "-p" = {
      value       = "$file_age_path$"
      description = "Directory to look in (not recursive)"
      required    = true
    }
    "--pattern" = {
      value       = "$file_age_pattern$"
      description = "Filename glob, e.g. 'itop-db-*.sql.gz' (must not contain '/')"
      required    = true
    }
    "-w" = {
      value       = "$file_age_warning$"
      description = "Warning threshold, age of the newest match in hours"
    }
    "-c" = {
      value       = "$file_age_critical$"
      description = "Critical threshold, age of the newest match in hours"
    }
    "--min-bytes" = {
      value       = "$file_age_min_bytes$"
      description = "Newest match smaller than this many bytes is CRITICAL (catches a truncated or empty file)"
    }
    "-t" = {
      value       = "$file_age_timeout$"
      description = "Timeout in seconds for the directory scan"
    }
  }

  vars.file_age_warning   = 26
  vars.file_age_critical  = 50
  vars.file_age_min_bytes = 1
  vars.file_age_timeout   = 30
}
