// check_itop_unassigned_tickets - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_unassigned_tickets/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "check_itop_unassigned_tickets" {
  check_command = "check_itop_unassigned_tickets"

  vars.check_itop_unassigned_tickets_url      = host.vars.check_itop_unassigned_tickets_url
  vars.check_itop_unassigned_tickets_username = host.vars.check_itop_unassigned_tickets_username
  vars.check_itop_unassigned_tickets_password = host.vars.check_itop_unassigned_tickets_password
  vars.check_itop_unassigned_tickets_warning  = host.vars.check_itop_unassigned_tickets_warning
  vars.check_itop_unassigned_tickets_critical = host.vars.check_itop_unassigned_tickets_critical
  vars.check_itop_unassigned_tickets_class    = host.vars.check_itop_unassigned_tickets_class

  assign where host.vars.check_itop_unassigned_tickets == true
  // or: assign where "itop-host" in host.templates

  // To check multiple ticket classes, duplicate this apply block with a different
  // service name and set vars.check_itop_unassigned_tickets_class per instance.
}
