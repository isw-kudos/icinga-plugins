// check_itop_unassigned_tickets - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_unassigned_tickets/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_itop_unassigned_tickets" {
  command = [ PluginDir + "/check_itop_unassigned_tickets" ]

  arguments = {
    "-H" = {
      value       = "$check_itop_unassigned_tickets_url$"
      description = "iTop base URL (e.g. https://itop.example.com)"
      required    = true
    }
    "-u" = {
      value       = "$check_itop_unassigned_tickets_username$"
      description = "iTop API username"
      required    = true
    }
    "-p" = {
      value       = "$check_itop_unassigned_tickets_password$"
      description = "iTop API password"
      required    = true
    }
    "-w" = {
      value       = "$check_itop_unassigned_tickets_warning$"
      description = "Warning threshold (unassigned ticket count)"
    }
    "-c" = {
      value       = "$check_itop_unassigned_tickets_critical$"
      description = "Critical threshold (unassigned ticket count)"
    }
    "-C" = {
      value       = "$check_itop_unassigned_tickets_class$"
      description = "Ticket class to check (Incident, UserRequest, Change, Problem)"
    }
    "-t" = {
      value       = "$check_itop_unassigned_tickets_timeout$"
      description = "Timeout in seconds"
    }
  }

  vars.check_itop_unassigned_tickets_warning  = 1
  vars.check_itop_unassigned_tickets_critical = 2
  vars.check_itop_unassigned_tickets_class    = "Incident"
  vars.check_itop_unassigned_tickets_timeout  = 10
}
