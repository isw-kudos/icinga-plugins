// check_cnx_search - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_cnx_search/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "check_cnx_search" {
  check_command = "check_cnx_search"

  vars.check_cnx_search_url      = host.vars.check_cnx_search_url
  vars.check_cnx_search_username = host.vars.check_cnx_search_username
  vars.check_cnx_search_password = host.vars.check_cnx_search_password
  vars.check_cnx_search_warning  = host.vars.check_cnx_search_warning
  vars.check_cnx_search_critical = host.vars.check_cnx_search_critical

  assign where host.vars.check_cnx_search == true
  // or: assign where "hcl-connections-host" in host.templates
}
