// check_cnx_search - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_cnx_search/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_cnx_search" {
  command = [ PluginDir + "/check_cnx_search" ]

  arguments = {
    "-H" = {
      value       = "$check_cnx_search_url$"
      description = "HCL Connections base URL (e.g. https://connections.example.com)"
      required    = true
    }
    "-u" = {
      value       = "$check_cnx_search_username$"
      description = "Username for authentication"
      required    = true
    }
    "-p" = {
      value       = "$check_cnx_search_password$"
      description = "Password for authentication"
      required    = true
    }
    "-w" = {
      value       = "$check_cnx_search_warning$"
      description = "Warning threshold in hours"
    }
    "-c" = {
      value       = "$check_cnx_search_critical$"
      description = "Critical threshold in hours"
    }
    "-t" = {
      value       = "$check_cnx_search_timeout$"
      description = "Timeout in seconds"
    }
  }

  vars.check_cnx_search_warning  = 20
  vars.check_cnx_search_critical = 24
  vars.check_cnx_search_timeout  = 30
}
