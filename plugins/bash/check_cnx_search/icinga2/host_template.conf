// check_cnx_search - Host Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_cnx_search/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

template Host "hcl-connections-host" {
  check_command = "hostalive"

  vars.check_cnx_search          = true
  vars.check_cnx_search_warning  = 20
  vars.check_cnx_search_critical = 24
}
