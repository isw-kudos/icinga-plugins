// check_acronis_disabled - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_acronis_disabled/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// NOTE: reading the aakore unit state requires root. If the Icinga agent does not
// run as root, invoke the plugin via sudo instead - see INSTALL.md - e.g.:
//   command = [ "sudo", PluginDir + "/check_acronis_disabled" ]

object CheckCommand "check_acronis_disabled" {
  command = [ PluginDir + "/check_acronis_disabled" ]

  arguments = {
    "--service" = {
      value       = "$acronis_disabled_service$"
      description = "systemd unit for cyber-protect-service"
    }
    "--unit" = {
      value       = "$acronis_disabled_unit$"
      description = "aakore unit name for the desktop/tray component"
    }
    "--tray-bin" = {
      value       = "$acronis_disabled_tray_bin$"
      description = "Tray binary matched with 'pgrep -f'"
    }
    "--aakore" = {
      value       = "$acronis_disabled_aakore$"
      description = "Path to the Acronis agent core CLI"
    }
    "-t" = {
      value       = "$acronis_disabled_timeout$"
      description = "Timeout per external command (default: 30)"
    }
  }

  vars.acronis_disabled_service  = "cyber-protect-service.service"
  vars.acronis_disabled_unit     = "cyber-desktop-service"
  vars.acronis_disabled_tray_bin = "/opt/acronis/bin/cyber-desktop-service-qt6"
  vars.acronis_disabled_aakore   = "/opt/acronis/aakore"
  vars.acronis_disabled_timeout  = 30
}
