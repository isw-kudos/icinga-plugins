// check_acronis_disabled - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_acronis_disabled/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "acronis-disabled" {
  check_command = "check_acronis_disabled"

  vars.acronis_disabled_service  = host.vars.acronis_disabled_service
  vars.acronis_disabled_unit     = host.vars.acronis_disabled_unit
  vars.acronis_disabled_tray_bin = host.vars.acronis_disabled_tray_bin
  vars.acronis_disabled_aakore   = host.vars.acronis_disabled_aakore

  // Policy-drift safety net, not an outage check - it never goes CRITICAL, so a
  // relaxed interval is fine. It catches a cloud "pull" / agent update that
  // silently re-enabled a component.
  check_interval = 15m
  retry_interval = 5m

  // The plugin inspects local systemd + aakore state, so run it on the agent
  // that hosts the Acronis components.
  command_endpoint = host.name

  // The plugin is safe to apply broadly (it returns OK on hosts without the
  // agent), but scoping to hosts that actually run the backup agent avoids noise.
  assign where host.vars.acronis_backup == true
}
