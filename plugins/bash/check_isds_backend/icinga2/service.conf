// check_isds_backend - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_backend/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "isds-backend" {
  check_command = "check_isds_backend"

  vars.isds_backend_db2_instance = host.vars.isds_backend_db2_instance
  vars.isds_backend_db2_database = host.vars.isds_backend_db2_database
  vars.isds_backend_db2_user     = host.vars.isds_backend_db2_user

  // Run frequently - this catches a down ibmslapd/db2sysc or a filling DB2 backend
  check_interval = 1m
  retry_interval = 30s

  // This plugin runs locally on the SDS host - execute it on the agent there.
  command_endpoint = host.name

  assign where host.vars.isds == true
}
