// check_isds_backend - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_backend/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_isds_backend" {
  command = [ PluginDir + "/check_isds_backend" ]

  arguments = {
    "--db2-instance" = {
      value       = "$isds_backend_db2_instance$"
      description = "DB2 instance name (required for db2-* sub-checks)"
    }
    "--db2-database" = {
      value       = "$isds_backend_db2_database$"
      description = "DB2 database name (required for db2-* sub-checks)"
    }
    "--db2-user" = {
      value       = "$isds_backend_db2_user$"
      description = "Run db2 as this OS user via 'su - USER -c ...'"
    }
    "-w" = {
      value       = "$isds_backend_tbsp_warn$"
      description = "Tablespace warn threshold (percent)"
    }
    "-c" = {
      value       = "$isds_backend_tbsp_crit$"
      description = "Tablespace crit threshold (percent)"
    }
    "--log-warn" = {
      value       = "$isds_backend_log_warn$"
      description = "Transaction-log warn threshold (percent)"
    }
    "--log-crit" = {
      value       = "$isds_backend_log_crit$"
      description = "Transaction-log crit threshold (percent)"
    }
    "--diradm-crit" = {
      set_if      = "$isds_backend_diradm_crit$"
      description = "Treat a missing ibmdiradm as CRITICAL (default: WARNING)"
    }
    "--no-diradm" = {
      set_if      = "$isds_backend_no_diradm$"
      description = "Skip the ibmdiradm process check"
    }
    "--no-proc" = {
      set_if      = "$isds_backend_no_proc$"
      description = "Disable the process liveness sub-check"
    }
    "--no-db2-tablespace" = {
      set_if      = "$isds_backend_no_tablespace$"
      description = "Disable the DB2 tablespace sub-check"
    }
    "--no-db2-logs" = {
      set_if      = "$isds_backend_no_logs$"
      description = "Disable the DB2 transaction-log sub-check"
    }
    "-t" = {
      value       = "$isds_backend_timeout$"
      description = "Timeout per external command (default: 30)"
    }
  }

  vars.isds_backend_tbsp_warn = 85
  vars.isds_backend_tbsp_crit = 95
  vars.isds_backend_log_warn  = 80
  vars.isds_backend_log_crit  = 90
  vars.isds_backend_timeout   = 30
}
