// check_isds_backend - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_backend/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Every minute - this catches a dead ibmslapd or db2sysc, and a DB2 backend
// that is filling up.

template Service "isds-backend" {
  check_command = "check_isds_backend"

  check_interval = 1m
  retry_interval = 30s
  max_check_attempts = 3

  // Inspects local processes and runs the local db2 CLI, so the check runs on
  // the agent on the SDS host.
  command_endpoint = host.name
}
