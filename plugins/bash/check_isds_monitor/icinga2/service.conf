// check_isds_monitor - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_monitor/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "isds-monitor" {
  check_command = "check_isds_monitor"

  vars.isds_monitor_binddn = host.vars.isds_monitor_binddn
  vars.isds_monitor_passfile = host.vars.isds_monitor_passfile

  // Run frequently - this catches worker-pool exhaustion ("hung but port open")
  check_interval = 1m
  retry_interval = 30s

  assign where host.vars.isds == true
}
