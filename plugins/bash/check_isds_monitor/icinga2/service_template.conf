// check_isds_monitor - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_monitor/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Every minute. This is the check that catches worker-pool exhaustion - the
// server that is "hung but port open", which a TCP or bind check passes.

template Service "isds-monitor" {
  check_command = "check_isds_monitor"

  check_interval = 1m
  retry_interval = 30s
  max_check_attempts = 3

  // The IBM LDAP client and the bind password file exist only on the SDS host,
  // so the check runs on the agent there and talks to the server on loopback.
  command_endpoint = host.name
}
