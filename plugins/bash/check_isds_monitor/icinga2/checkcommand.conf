// check_isds_monitor - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_monitor/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_isds_monitor" {
  command = [ PluginDir + "/check_isds_monitor" ]

  arguments = {
    "-H" = {
      value       = "$isds_monitor_host$"
      description = "LDAP host/IP (default: 127.0.0.1)"
    }
    "-p" = {
      value       = "$isds_monitor_port$"
      description = "LDAP port (default: 389)"
    }
    "--ldaps" = {
      set_if      = "$isds_monitor_ldaps$"
      description = "Use ldaps://"
    }
    "-Z" = {
      set_if      = "$isds_monitor_starttls$"
      description = "Use StartTLS on the plain port"
    }
    "-D" = {
      value       = "$isds_monitor_binddn$"
      description = "Bind DN (read-only monitor account)"
    }
    "-y" = {
      value       = "$isds_monitor_passfile$"
      description = "File containing the bind password (preferred over -W)"
    }
    "--monitor-base" = {
      value       = "$isds_monitor_base$"
      description = "Monitor search base (default: cn=monitor)"
    }
    "--workers-warn" = {
      value       = "$isds_monitor_workers_warn$"
      description = "Warn when available workers <= N"
    }
    "--workers-crit" = {
      value       = "$isds_monitor_workers_crit$"
      description = "Crit when available workers <= N"
    }
    "--conn-warn" = {
      value       = "$isds_monitor_conn_warn$"
      description = "Warn when current connections >= N"
    }
    "--conn-crit" = {
      value       = "$isds_monitor_conn_crit$"
      description = "Crit when current connections >= N"
    }
    "--cache-warn" = {
      value       = "$isds_monitor_cache_warn$"
      description = "Warn when a cache hit ratio < PCT%"
    }
    "--cache-crit" = {
      value       = "$isds_monitor_cache_crit$"
      description = "Crit when a cache hit ratio < PCT%"
    }
    "-t" = {
      value       = "$isds_monitor_timeout$"
      description = "Timeout in seconds (default: 30)"
    }
  }

  vars.isds_monitor_host         = "$address$"
  vars.isds_monitor_port         = 389
  vars.isds_monitor_workers_warn = 2
  vars.isds_monitor_workers_crit = 1
  vars.isds_monitor_cache_warn   = 80
  vars.isds_monitor_cache_crit   = 50
  vars.isds_monitor_timeout      = 30
}
