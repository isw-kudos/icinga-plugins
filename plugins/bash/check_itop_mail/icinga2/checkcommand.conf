// check_itop_mail - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_mail/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// NOTE: config-itop.php is typically mode 440 owned by the web user, so the
// icinga user cannot read it. If the agent does not run as root, invoke the
// plugin via sudo instead - see INSTALL.md - e.g.:
//   command = [ "sudo", PluginDir + "/check_itop_mail" ]
//
// There is no password argument by design - point itop_db_defaults_file at a
// mode 0600 my.cnf.

object CheckCommand "check_itop_mail" {
  command = [ PluginDir + "/check_itop_mail" ]

  arguments = {
    "--config" = {
      value       = "$itop_mail_config$"
      description = "Path to config-itop.php on the host filesystem"
    }
    "--expect-transport" = {
      value       = "$itop_mail_expect_transport$"
      description = "Transport that means mail leaves the host; anything else (LogFile, Null) means notifications go nowhere"
    }
    "--forbid-host" = {
      value       = "$itop_mail_forbid_hosts$"
      description = "Relay hostname that is a capture sink, e.g. 'mailpit' (repeatable)"
      repeat_key  = true
    }
    "--expect-verify-peer" = {
      value       = "$itop_mail_expect_verify_peer$"
      description = "Assert email_transport_smtp.verify_peer is 0 or 1; omit to skip"
    }
    "--no-config" = {
      set_if      = "$itop_mail_no_config$"
      description = "Skip the configuration half entirely"
    }
    "--no-db" = {
      set_if      = "$itop_mail_no_db$"
      description = "Skip the database half entirely"
    }
    "-H" = {
      value       = "$itop_db_host$"
      description = "Database host"
    }
    "-P" = {
      value       = "$itop_db_port$"
      description = "Database port"
    }
    "-d" = {
      value       = "$itop_db_name$"
      description = "Database name"
    }
    "-u" = {
      value       = "$itop_db_user$"
      description = "Database user (omit if the defaults file supplies it)"
    }
    "--defaults-file" = {
      value       = "$itop_db_defaults_file$"
      description = "my.cnf-style file holding the read-only credentials (mode 0600)"
    }
    "--window-hours" = {
      value       = "$itop_mail_window_hours$"
      description = "How far back to look for send failures"
    }
    "--failure-prefix" = {
      value       = "$itop_mail_failure_prefix$"
      description = "priv_event.message prefix that marks a real failure"
    }
    "-w" = {
      value       = "$itop_mail_warning$"
      description = "Warning threshold, send failure count"
    }
    "-c" = {
      value       = "$itop_mail_critical$"
      description = "Critical threshold, send failure count; leave unset to never go CRITICAL"
    }
    "-t" = {
      value       = "$itop_db_timeout$"
      description = "Query timeout in seconds"
    }
  }

  vars.itop_db_host                  = "127.0.0.1"
  vars.itop_db_port                  = 3306
  vars.itop_db_name                  = "itop"
  vars.itop_db_timeout               = 30
  vars.itop_mail_expect_transport    = "SMTP"
  vars.itop_mail_window_hours        = 1
  vars.itop_mail_warning             = 1
  vars.itop_mail_no_config           = false
  vars.itop_mail_no_db               = false
}
