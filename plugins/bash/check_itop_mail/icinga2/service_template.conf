// check_itop_mail - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_itop_mail/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Hourly. The configuration half is drift detection - it catches a change made
// hours or days ago, so a fast poll buys nothing - and the database half looks
// back over a window rather than at an instant.

template Service "itop-mail" {
  check_command = "check_itop_mail"

  check_interval = 1h
  retry_interval = 15m
  max_check_attempts = 2

  // Reads a local config file and reaches the database on loopback, so the
  // check runs on the agent rather than the master.
  command_endpoint = host.name
}
