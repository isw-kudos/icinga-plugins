// check_cnx_docs - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_cnx_docs/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_cnx_docs" {
  command = [ PluginDir + "/check_cnx_docs" ]

  arguments = {
    "--instances-cfg" = {
      value       = "$check_cnx_docs_instances_cfg$"
      description = "Path to sym_monitor instances.cfg (default: /opt/Conversion/symphony/sym_monitor/instances.cfg). Expected soffice count = number of non-empty lines."
    }
    "--sym-monitor-pattern" = {
      value       = "$check_cnx_docs_sym_monitor_pattern$"
      description = "pgrep -f pattern for sym_monitor (default: sym_monitor)"
    }
    "--soffice-pattern" = {
      value       = "$check_cnx_docs_soffice_pattern$"
      description = "pgrep -f pattern for soffice (default: soffice)"
    }
    "--sym-monitor-grace-seconds" = {
      value       = "$check_cnx_docs_sym_monitor_grace_seconds$"
      description = "Suppress CRITICAL while sym_monitor has been down for <= N seconds (covers the cron restart window). Set to 0 to disable. (default: 300)"
    }
    "--state-file" = {
      value       = "$check_cnx_docs_state_file$"
      description = "Path to the state file used to track first time sym_monitor was seen down (default: /tmp/check_cnx_docs.state)"
    }
    "-t" = {
      value       = "$check_cnx_docs_timeout$"
      description = "Per-operation timeout in seconds (default: 30)"
    }
    "--no-sym-monitor" = {
      set_if      = "$check_cnx_docs_no_sym_monitor$"
      description = "Disable the sym_monitor sub-check"
    }
    "--no-soffice" = {
      set_if      = "$check_cnx_docs_no_soffice$"
      description = "Disable the soffice sub-check"
    }
  }

  vars.check_cnx_docs_instances_cfg             = "/opt/Conversion/symphony/sym_monitor/instances.cfg"
  vars.check_cnx_docs_sym_monitor_pattern       = "sym_monitor"
  vars.check_cnx_docs_soffice_pattern           = "soffice"
  vars.check_cnx_docs_sym_monitor_grace_seconds = 300
  vars.check_cnx_docs_state_file                = "/tmp/check_cnx_docs.state"
  vars.check_cnx_docs_timeout                   = 30
  vars.check_cnx_docs_no_sym_monitor            = false
  vars.check_cnx_docs_no_soffice                = false
}
