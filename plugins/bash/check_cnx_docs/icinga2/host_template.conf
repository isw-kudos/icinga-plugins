// check_cnx_docs - Host Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_cnx_docs/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

template Host "cnx-docs-conversion-host" {
  check_command = "hostalive"

  vars.check_cnx_docs                           = true
  vars.check_cnx_docs_instances_cfg             = "/opt/Conversion/symphony/sym_monitor/instances.cfg"
  vars.check_cnx_docs_sym_monitor_grace_seconds = 300
  vars.check_cnx_docs_state_file                = "/tmp/check_cnx_docs.state"
  vars.check_cnx_docs_timeout                   = 30
}
