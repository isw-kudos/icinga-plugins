// check_cnx_docs - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_cnx_docs/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "check_cnx_docs" {
  check_command = "check_cnx_docs"

  vars.check_cnx_docs_instances_cfg             = host.vars.check_cnx_docs_instances_cfg
  vars.check_cnx_docs_sym_monitor_pattern       = host.vars.check_cnx_docs_sym_monitor_pattern
  vars.check_cnx_docs_soffice_pattern           = host.vars.check_cnx_docs_soffice_pattern
  vars.check_cnx_docs_sym_monitor_grace_seconds = host.vars.check_cnx_docs_sym_monitor_grace_seconds
  vars.check_cnx_docs_state_file                = host.vars.check_cnx_docs_state_file
  vars.check_cnx_docs_timeout                   = host.vars.check_cnx_docs_timeout
  vars.check_cnx_docs_no_sym_monitor            = host.vars.check_cnx_docs_no_sym_monitor
  vars.check_cnx_docs_no_soffice                = host.vars.check_cnx_docs_no_soffice

  assign where host.vars.check_cnx_docs == true
  // or: assign where "cnx-docs-conversion-host" in host.templates
}
