// check_isds_cert - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_cert/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "isds-cert" {
  check_command = "check_isds_cert"

  vars.isds_cert_kdb   = host.vars.isds_cert_kdb
  vars.isds_cert_stash = host.vars.isds_cert_stash

  // Certificate expiry changes slowly - check a few times a day, not every minute.
  check_interval = 6h
  retry_interval = 10m

  assign where host.vars.isds == true
}
