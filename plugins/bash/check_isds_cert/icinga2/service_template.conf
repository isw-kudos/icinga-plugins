// check_isds_cert - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_cert/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

// Certificate expiry changes slowly - a few times a day is plenty.

template Service "isds-cert" {
  check_command = "check_isds_cert"

  check_interval = 6h
  retry_interval = 10m
  max_check_attempts = 2

  // Reads the GSKit keystore from the SDS host's filesystem, so the check runs
  // on the agent there.
  command_endpoint = host.name
}
