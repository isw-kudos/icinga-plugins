// check_isds_cert - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/bash/check_isds_cert/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_isds_cert" {
  command = [ PluginDir + "/check_isds_cert" ]

  arguments = {
    "--kdb" = {
      value       = "$isds_cert_kdb$"
      description = "Path to the GSKit CMS keystore (.kdb)"
      required    = true
    }
    "--stash" = {
      value       = "$isds_cert_stash$"
      description = "Path to the .sth stash file (preferred over --password)"
    }
    "--password" = {
      value       = "$isds_cert_password$"
      description = "Keystore password (discouraged - visible in process list)"
    }
    "--label" = {
      value       = "$isds_cert_label$"
      description = "Check only this cert label (default: all certs)"
    }
    "-w" = {
      value       = "$isds_cert_warn$"
      description = "Warn when a cert expires within DAYS days"
    }
    "-c" = {
      value       = "$isds_cert_crit$"
      description = "Crit when a cert expires within DAYS days"
    }
    "-t" = {
      value       = "$isds_cert_timeout$"
      description = "Timeout in seconds (default: 30)"
    }
  }

  vars.isds_cert_warn    = 30
  vars.isds_cert_crit    = 7
  vars.isds_cert_timeout = 30
}
