// check_k8s_workloads - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_k8s_workloads/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "check_k8s_workloads" {
  check_command = "check_k8s_workloads"

  vars.check_k8s_kubeconfig                    = host.vars.check_k8s_kubeconfig
  vars.check_k8s_context                       = host.vars.check_k8s_context
  vars.check_k8s_api_url                       = host.vars.check_k8s_api_url
  vars.check_k8s_token                         = host.vars.check_k8s_token
  vars.check_k8s_ca_cert                       = host.vars.check_k8s_ca_cert
  vars.check_k8s_insecure                      = host.vars.check_k8s_insecure
  vars.check_k8s_workloads_namespaces          = host.vars.check_k8s_workloads_namespaces
  vars.check_k8s_workloads_exclude_namespaces  = host.vars.check_k8s_workloads_exclude_namespaces
  vars.check_k8s_workloads_selector            = host.vars.check_k8s_workloads_selector
  vars.check_k8s_workloads_skip_deployments    = host.vars.check_k8s_workloads_skip_deployments
  vars.check_k8s_workloads_skip_statefulsets   = host.vars.check_k8s_workloads_skip_statefulsets
  vars.check_k8s_workloads_timeout             = host.vars.check_k8s_workloads_timeout
  vars.check_k8s_workloads_verbose             = host.vars.check_k8s_workloads_verbose

  assign where host.vars.check_k8s_workloads == true
  // or: assign where "kubernetes-cluster" in host.templates
}
