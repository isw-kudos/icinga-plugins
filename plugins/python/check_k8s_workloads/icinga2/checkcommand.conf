// check_k8s_workloads - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_k8s_workloads/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_k8s_workloads" {
  command = [ PluginDir + "/check_k8s_workloads" ]

  arguments = {
    "--kubeconfig" = {
      value       = "$check_k8s_kubeconfig$"
      description = "Path to kubeconfig file"
    }
    "--context" = {
      value       = "$check_k8s_context$"
      description = "kubeconfig context to use"
    }
    "--api-url" = {
      value       = "$check_k8s_api_url$"
      description = "Kubernetes API server URL (use with --token)"
    }
    "--token" = {
      value       = "$check_k8s_token$"
      description = "Bearer token (use with --api-url)"
    }
    "--ca-cert" = {
      value       = "$check_k8s_ca_cert$"
      description = "CA certificate file for API server"
    }
    "--insecure" = {
      set_if      = "$check_k8s_insecure$"
      description = "Skip TLS verification (not recommended)"
    }
    "-n" = {
      value       = "$check_k8s_workloads_namespaces$"
      description = "Namespace(s) to check"
      repeat_key  = true
    }
    "--exclude-namespace" = {
      value       = "$check_k8s_workloads_exclude_namespaces$"
      description = "Namespace(s) to skip (when not using -n)"
      repeat_key  = true
    }
    "-l" = {
      value       = "$check_k8s_workloads_selector$"
      description = "Label selector"
    }
    "--no-deployments" = {
      set_if      = "$check_k8s_workloads_skip_deployments$"
      description = "Do not check Deployments"
    }
    "--no-statefulsets" = {
      set_if      = "$check_k8s_workloads_skip_statefulsets$"
      description = "Do not check StatefulSets"
    }
    "-t" = {
      value       = "$check_k8s_workloads_timeout$"
      description = "Plugin timeout in seconds"
    }
    "-v" = {
      set_if      = "$check_k8s_workloads_verbose$"
      description = "Show OK workloads in output"
    }
  }

  vars.check_k8s_workloads_skip_deployments  = false
  vars.check_k8s_workloads_skip_statefulsets = false
  vars.check_k8s_workloads_timeout           = 30
  vars.check_k8s_workloads_verbose           = false
  vars.check_k8s_insecure                    = false
}
