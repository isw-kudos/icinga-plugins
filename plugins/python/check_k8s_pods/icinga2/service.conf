// check_k8s_pods - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_k8s_pods/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "check_k8s_pods" {
  check_command = "check_k8s_pods"

  vars.check_k8s_kubeconfig             = host.vars.check_k8s_kubeconfig
  vars.check_k8s_context                = host.vars.check_k8s_context
  vars.check_k8s_api_url                = host.vars.check_k8s_api_url
  vars.check_k8s_token                  = host.vars.check_k8s_token
  vars.check_k8s_ca_cert                = host.vars.check_k8s_ca_cert
  vars.check_k8s_insecure               = host.vars.check_k8s_insecure
  vars.check_k8s_pods_namespaces        = host.vars.check_k8s_pods_namespaces
  vars.check_k8s_pods_exclude_namespaces = host.vars.check_k8s_pods_exclude_namespaces
  vars.check_k8s_pods_selector          = host.vars.check_k8s_pods_selector
  vars.check_k8s_pods_restart_warning   = host.vars.check_k8s_pods_restart_warning
  vars.check_k8s_pods_restart_critical  = host.vars.check_k8s_pods_restart_critical
  vars.check_k8s_pods_pending_grace     = host.vars.check_k8s_pods_pending_grace
  vars.check_k8s_pods_timeout           = host.vars.check_k8s_pods_timeout
  vars.check_k8s_pods_verbose           = host.vars.check_k8s_pods_verbose

  assign where host.vars.check_k8s_pods == true
  // or: assign where "kubernetes-cluster" in host.templates
}
