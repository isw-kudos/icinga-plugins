// check_k8s_pods - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_k8s_pods/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_k8s_pods" {
  command = [ PluginDir + "/check_k8s_pods" ]

  arguments = {
    "--kubeconfig" = {
      value       = "$check_k8s_kubeconfig$"
      description = "Path to kubeconfig file"
    }
    "--context" = {
      value       = "$check_k8s_context$"
      description = "kubeconfig context to use"
    }
    "--api-url" = {
      value       = "$check_k8s_api_url$"
      description = "Kubernetes API server URL (use with --token)"
    }
    "--token" = {
      value       = "$check_k8s_token$"
      description = "Bearer token (use with --api-url)"
    }
    "--ca-cert" = {
      value       = "$check_k8s_ca_cert$"
      description = "CA certificate file for API server"
    }
    "--insecure" = {
      set_if      = "$check_k8s_insecure$"
      description = "Skip TLS verification (not recommended)"
    }
    "-n" = {
      value       = "$check_k8s_pods_namespaces$"
      description = "Namespace(s) to check"
      repeat_key  = true
    }
    "--exclude-namespace" = {
      value       = "$check_k8s_pods_exclude_namespaces$"
      description = "Namespace(s) to skip (when not using -n)"
      repeat_key  = true
    }
    "-l" = {
      value       = "$check_k8s_pods_selector$"
      description = "Label selector"
    }
    "-w" = {
      value       = "$check_k8s_pods_restart_warning$"
      description = "WARNING threshold for container restart count"
    }
    "-c" = {
      value       = "$check_k8s_pods_restart_critical$"
      description = "CRITICAL threshold for container restart count"
    }
    "--pending-grace" = {
      value       = "$check_k8s_pods_pending_grace$"
      description = "Seconds a pod may stay Pending before CRITICAL"
    }
    "-t" = {
      value       = "$check_k8s_pods_timeout$"
      description = "Plugin timeout in seconds"
    }
    "-v" = {
      set_if      = "$check_k8s_pods_verbose$"
      description = "Show OK pods in output"
    }
  }

  vars.check_k8s_pods_restart_warning  = 5
  vars.check_k8s_pods_restart_critical = 20
  vars.check_k8s_pods_pending_grace    = 300
  vars.check_k8s_pods_timeout          = 30
  vars.check_k8s_pods_verbose          = false
  vars.check_k8s_insecure              = false
}
