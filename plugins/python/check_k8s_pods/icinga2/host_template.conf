// check_k8s_pods - Host Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_k8s_pods/INSTALL.md
// Minimum Icinga 2 version: 2.13.0
//
// Shared template for any host that represents a Kubernetes cluster being
// checked by the check_k8s_* family of plugins. Set auth vars on the host
// object (kubeconfig path, or api-url + token).

template Host "kubernetes-cluster" {
  check_command = "hostalive"

  vars.check_k8s_pods      = true
  vars.check_k8s_workloads = true
  vars.check_k8s_nodes     = true

  // Auth (set one of the two methods on the host):
  // vars.check_k8s_kubeconfig = "/etc/icinga2/k8s/kubeconfig"
  // vars.check_k8s_api_url    = "https://kube-api.example.com:6443"
  // vars.check_k8s_token      = "<bearer-token>"
  // vars.check_k8s_ca_cert    = "/etc/icinga2/k8s/ca.crt"
}
