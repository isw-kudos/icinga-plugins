// check_k8s_nodes - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_k8s_nodes/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "check_k8s_nodes" {
  check_command = "check_k8s_nodes"

  vars.check_k8s_kubeconfig            = host.vars.check_k8s_kubeconfig
  vars.check_k8s_context               = host.vars.check_k8s_context
  vars.check_k8s_api_url               = host.vars.check_k8s_api_url
  vars.check_k8s_token                 = host.vars.check_k8s_token
  vars.check_k8s_ca_cert               = host.vars.check_k8s_ca_cert
  vars.check_k8s_insecure              = host.vars.check_k8s_insecure
  vars.check_k8s_nodes_selector        = host.vars.check_k8s_nodes_selector
  vars.check_k8s_nodes_ignore_cordon   = host.vars.check_k8s_nodes_ignore_cordon
  vars.check_k8s_nodes_timeout         = host.vars.check_k8s_nodes_timeout
  vars.check_k8s_nodes_verbose         = host.vars.check_k8s_nodes_verbose

  assign where host.vars.check_k8s_nodes == true
  // or: assign where "kubernetes-cluster" in host.templates
}
