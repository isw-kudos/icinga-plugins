// check_k8s_nodes - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_k8s_nodes/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_k8s_nodes" {
  command = [ PluginDir + "/check_k8s_nodes" ]

  arguments = {
    "--kubeconfig" = {
      value       = "$check_k8s_kubeconfig$"
      description = "Path to kubeconfig file"
    }
    "--context" = {
      value       = "$check_k8s_context$"
      description = "kubeconfig context to use"
    }
    "--api-url" = {
      value       = "$check_k8s_api_url$"
      description = "Kubernetes API server URL (use with --token)"
    }
    "--token" = {
      value       = "$check_k8s_token$"
      description = "Bearer token (use with --api-url)"
    }
    "--ca-cert" = {
      value       = "$check_k8s_ca_cert$"
      description = "CA certificate file for API server"
    }
    "--insecure" = {
      set_if      = "$check_k8s_insecure$"
      description = "Skip TLS verification (not recommended)"
    }
    "-l" = {
      value       = "$check_k8s_nodes_selector$"
      description = "Node label selector"
    }
    "--ignore-cordon" = {
      set_if      = "$check_k8s_nodes_ignore_cordon$"
      description = "Do not WARN on cordoned nodes"
    }
    "-t" = {
      value       = "$check_k8s_nodes_timeout$"
      description = "Plugin timeout in seconds"
    }
    "-v" = {
      set_if      = "$check_k8s_nodes_verbose$"
      description = "Show OK nodes in output"
    }
  }

  vars.check_k8s_nodes_ignore_cordon = false
  vars.check_k8s_nodes_timeout       = 30
  vars.check_k8s_nodes_verbose       = false
  vars.check_k8s_insecure            = false
}
