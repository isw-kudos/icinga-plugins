// check_ionos_nfs_usage - Host Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_ionos_nfs_usage/INSTALL.md
// Minimum Icinga 2 version: 2.13.0
//
// A host that stands for one IONOS Cloud Network File Storage cluster. The
// check talks to the IONOS API, not to the cluster, so set the host address to
// the cluster IP only if the checking node can reach it; otherwise change the
// check_command to "dummy".

template Host "ionos-nfs-cluster" {
  check_command = "hostalive"

  vars.ionos_nfs_usage      = true
  vars.ionos_nfs_location   = "de-fra"   // change to the cluster's location
  vars.ionos_nfs_token_file = "/etc/icinga2/ionos-nfs.token"
  // Needed only when the location has more than one cluster:
  // vars.ionos_nfs_cluster = "<cluster ID or name>"

  vars.ionos_nfs_warning  = 80
  vars.ionos_nfs_critical = 90
}
