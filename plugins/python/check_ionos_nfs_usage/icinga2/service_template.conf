// check_ionos_nfs_usage - Service Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_ionos_nfs_usage/INSTALL.md
// Minimum Icinga 2 version: 2.13.0
//
// Runs on the node that schedules it (master or satellite), which needs
// outbound HTTPS to nfs.<location>.ionos.com. Do not set command_endpoint to
// an agent: the check reads the IONOS API, not local state.

template Service "ionos-nfs-usage" {
  check_command = "check_ionos_nfs_usage"

  check_interval     = 5m
  retry_interval     = 1m
  max_check_attempts = 3
}
