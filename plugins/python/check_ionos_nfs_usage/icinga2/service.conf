// check_ionos_nfs_usage - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_ionos_nfs_usage/INSTALL.md
// Minimum Icinga 2 version: 2.13.0
//
// The ionos_nfs_* vars are deliberately not copied from the host: Icinga
// resolves $ionos_nfs_*$ from the host by itself, and copying a var the host
// does not set would hide the CheckCommand default behind a null.

apply Service "ionos-nfs-usage" {
  import "ionos-nfs-usage"

  assign where host.vars.ionos_nfs_usage == true
  // or: assign where "ionos-nfs-cluster" in host.templates
}
