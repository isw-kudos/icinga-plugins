// check_ionos_nfs_usage - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_ionos_nfs_usage/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_ionos_nfs_usage" {
  command = [ PluginDir + "/check_ionos_nfs_usage" ]

  arguments = {
    "-L" = {
      value       = "$ionos_nfs_location$"
      description = "IONOS location of the NFS cluster, e.g. de-fra, de-txl, gb-lhr"
      required    = true
    }
    "-C" = {
      value       = "$ionos_nfs_cluster$"
      description = "Cluster ID or name (may be omitted when the location has only one cluster)"
    }
    "--token-file" = {
      value       = "$ionos_nfs_token_file$"
      description = "File whose first line is the IONOS API token"
      required    = true
    }
    "-w" = {
      value       = "$ionos_nfs_warning$"
      description = "Warning when total usage reaches this percentage of the cluster size"
    }
    "-c" = {
      value       = "$ionos_nfs_critical$"
      description = "Critical when total usage reaches this percentage of the cluster size"
    }
    "-t" = {
      value       = "$ionos_nfs_timeout$"
      description = "Timeout in seconds for the whole check"
    }
  }

  vars.ionos_nfs_warning  = 80
  vars.ionos_nfs_critical = 90
  vars.ionos_nfs_timeout  = 30
}
