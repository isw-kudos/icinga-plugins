// check_nfs_mount - CheckCommand Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_nfs_mount/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

object CheckCommand "check_nfs_mount" {
  command = [ PluginDir + "/check_nfs_mount" ]

  arguments = {
    "-m" = {
      value       = "$check_nfs_mount_mounts$"
      description = "NFS mount point(s) to check"
      repeat_key  = true
      required    = true
    }
    "-t" = {
      value       = "$check_nfs_mount_timeout$"
      description = "Timeout in seconds per mount check"
    }
    "-w" = {
      set_if      = "$check_nfs_mount_write$"
      description = "Also verify mount is writable (creates and removes a test file)"
    }
    "-v" = {
      set_if      = "$check_nfs_mount_verbose$"
      description = "Show per-mount detail in output even when OK"
    }
  }

  vars.check_nfs_mount_timeout  = 10
  vars.check_nfs_mount_write    = false
  vars.check_nfs_mount_verbose  = false
}
