// check_nfs_mount - Service Definition
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: plugins/python/check_nfs_mount/INSTALL.md
// Minimum Icinga 2 version: 2.13.0

apply Service "check_nfs_mount" {
  check_command = "check_nfs_mount"

  vars.check_nfs_mount_mounts  = host.vars.check_nfs_mount_mounts
  vars.check_nfs_mount_timeout = host.vars.check_nfs_mount_timeout
  vars.check_nfs_mount_write   = host.vars.check_nfs_mount_write

  assign where host.vars.check_nfs_mount == true
  // or: assign where "nfs-client-host" in host.templates
}
