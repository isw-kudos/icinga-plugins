// iTop Service Set - Service Definitions
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: servicesets/itop/README.md
// Minimum Icinga 2 version: 2.13.0

// The whole iTop set in one file: seven checks, of which two reuse plugins that
// already exist rather than adding new ones.
//
// DEPLOY THIS *INSTEAD OF* the per-plugin service.conf files, not alongside
// them. Both define apply rules of the same name, and Icinga will refuse to
// start on the duplicate.
//
// Every rule assigns on host.vars.itop, set by the "itop-host" host template.

// ---------------------------------------------------------------------------
// 1. The application, through the VIP                            [check #1]
// ---------------------------------------------------------------------------
// Reuses the ITL "http" command - nagios-plugins-http is already on every
// agent, and writing a plugin to duplicate it would buy nothing.
//
// This must traverse the VIP. The cutover-night outage was a break *between*
// the load balancer and the backend while every component was individually
// healthy, and only an end-to-end request sees that. Do not point it at
// localhost or at a container.
apply Service "itop-http" {
  check_command = "http"

  vars.http_vhost  = host.vars.itop_http_vhost
  vars.http_uri    = host.vars.itop_http_uri
  vars.http_string = host.vars.itop_http_string
  vars.http_ssl    = true
  vars.http_sni    = true
  vars.http_expect = "200,302"

  check_interval = 1m
  retry_interval = 30s
  max_check_attempts = 3

  // Deliberately NOT command_endpoint: this runs from the master so that it
  // exercises the same path a user takes.

  assign where host.vars.itop == true
}

// ---------------------------------------------------------------------------
// 2. Backup freshness                                            [check #2]
// ---------------------------------------------------------------------------
// The only check in the set that detects absence.
apply Service "itop-backup-age" {
  import "file-age"

  vars.file_age_path     = host.vars.itop_backup_dir
  vars.file_age_pattern  = host.vars.itop_backup_pattern
  vars.file_age_warning  = 26
  vars.file_age_critical = 50
  // A failed dump often leaves a truncated file behind, which is fresh and
  // would otherwise read as healthy. 1 KiB is well below any real dump.
  vars.file_age_min_bytes = 1024

  assign where host.vars.itop == true
}

// ---------------------------------------------------------------------------
// 3. Backup integrity                                            [check #3]
// ---------------------------------------------------------------------------
apply Service "itop-backup-integrity" {
  import "archive-integrity"

  vars.archive_integrity_path    = host.vars.itop_backup_dir
  vars.archive_integrity_pattern = host.vars.itop_backup_pattern

  assign where host.vars.itop == true
}

// ---------------------------------------------------------------------------
// 5. Synchro replicas in error, against a baseline               [check #5]
// ---------------------------------------------------------------------------
apply Service "itop-replica-errors" {
  import "itop-replica-errors"

  vars.itop_db_host          = host.vars.itop_db_host
  vars.itop_db_port          = host.vars.itop_db_port
  vars.itop_db_name          = host.vars.itop_db_name
  vars.itop_db_user          = host.vars.itop_db_user
  vars.itop_db_defaults_file = host.vars.itop_db_defaults_file

  vars.itop_replica_errors_baseline       = host.vars.itop_replica_errors_baseline
  vars.itop_replica_errors_ignore_sources = host.vars.itop_replica_errors_ignore_sources

  assign where host.vars.itop == true
}

// ---------------------------------------------------------------------------
// 7. Container state                                             [check #7]
// ---------------------------------------------------------------------------
// Reuses check_docker.py, already deployed to PluginDir on every agent.
//
// Split into three services on purpose:
//
//  a) status + uptime + restarts, for the always-present containers
//  b) health, scoped to the only container that defines a healthcheck -
//     check_docker returns UNKNOWN for a container with no health data, so a
//     combined run would make the others UNKNOWN
//  c) the cron container, which may legitimately not be deployed
//
// --uptime is what catches a crash loop, and it is deliberately level-based:
// a container restarting every thirty seconds is still "running", and a check
// that fired only on the *change* in restart count would go CRITICAL for one
// poll and OK on the next - never surviving max_check_attempts, so never
// notifying at all.
apply Service "itop-containers" {
  check_command = "check_docker"

  vars.check_docker_containers = host.vars.itop_containers
  vars.check_docker_present    = true
  vars.check_docker_status     = "running"
  vars.check_docker_uptime     = "120:60"
  vars.check_docker_restarts   = "5:20"

  command_endpoint = host.name

  check_interval = 2m
  retry_interval = 1m

  assign where host.vars.itop == true
}

apply Service "itop-containers-health" {
  check_command = "check_docker"

  vars.check_docker_containers = host.vars.itop_healthy_container
  vars.check_docker_present    = true
  vars.check_docker_status     = "running"
  vars.check_docker_health     = true

  command_endpoint = host.name

  check_interval = 2m
  retry_interval = 1m

  assign where host.vars.itop == true
}

// The cron container sits behind a compose profile, so on an instance where it
// was never enabled it legitimately does not exist. Gated separately rather
// than folded into itop-containers, where --present would alert forever.
apply Service "itop-cron-container" {
  check_command = "check_docker"

  vars.check_docker_containers = [ "^itop-cron$$" ]
  vars.check_docker_present    = true
  vars.check_docker_status     = "running"
  vars.check_docker_uptime     = "120:60"
  vars.check_docker_restarts   = "5:20"

  command_endpoint = host.name

  check_interval = 2m
  retry_interval = 1m

  assign where host.vars.itop == true && host.vars.itop_cron_container_enabled == true
}

// ---------------------------------------------------------------------------
// 8. itop-cron is actually processing                            [check #8]
// ---------------------------------------------------------------------------
// Distinct from itop-cron-container above: that one says the process started,
// this one says it is doing work.
apply Service "itop-cron" {
  import "itop-cron"

  vars.itop_db_host          = host.vars.itop_db_host
  vars.itop_db_port          = host.vars.itop_db_port
  vars.itop_db_name          = host.vars.itop_db_name
  vars.itop_db_user          = host.vars.itop_db_user
  vars.itop_db_defaults_file = host.vars.itop_db_defaults_file

  vars.itop_cron_planned_column = host.vars.itop_cron_planned_column

  assign where host.vars.itop == true && host.vars.itop_cron_container_enabled == true
}

// ---------------------------------------------------------------------------
// 9. Mail is leaving, and not going to a sink                    [check #9]
// ---------------------------------------------------------------------------
apply Service "itop-mail" {
  import "itop-mail"

  vars.itop_db_host          = host.vars.itop_db_host
  vars.itop_db_port          = host.vars.itop_db_port
  vars.itop_db_name          = host.vars.itop_db_name
  vars.itop_db_user          = host.vars.itop_db_user
  vars.itop_db_defaults_file = host.vars.itop_db_defaults_file

  vars.itop_mail_config           = host.vars.itop_mail_config
  vars.itop_mail_expect_transport = host.vars.itop_mail_expect_transport
  vars.itop_mail_forbid_hosts     = host.vars.itop_mail_forbid_hosts

  assign where host.vars.itop == true
}
