// iTop Service Set - Host Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: servicesets/itop/README.md
// Minimum Icinga 2 version: 2.13.0

// Importing this template turns on every service in the iTop set and carries
// the settings they share. The database connection is defined once, in
// itop_db_*, rather than repeated per check.
//
// Override any of these per host after the import.

template Host "itop-host" {
  check_command = "hostalive"

  // The single flag every service in the set assigns on.
  vars.itop = true

  // --- Shared database connection (check_itop_cron, _replica_errors, _mail) ---
  // The password is NOT here. It belongs in a mode 0600 my.cnf on the agent,
  // referenced only by path - see servicesets/itop/README.md.
  vars.itop_db_host          = "127.0.0.1"
  vars.itop_db_port          = 3306
  vars.itop_db_name          = "itop"
  vars.itop_db_defaults_file = "/etc/icinga2/itop-ro.cnf"
  vars.itop_db_timeout       = 30

  // --- The application, through the VIP ---
  // Must be the public name, never localhost and never a container: the point
  // is to exercise the whole path, load balancer included.
  vars.itop_http_vhost  = "support.example.com"
  vars.itop_http_uri    = "/pages/UI.php"
  vars.itop_http_string = "iTop"

  // --- Backups ---
  vars.itop_backup_dir     = "/backups"
  vars.itop_backup_pattern = "itop-db-*.sql.gz"

  // --- Containers ---
  // Anchored regexes. check_docker matches these as patterns, so an unanchored
  // "itop" would match every container in the stack and "itop-tls" would also
  // match the one-shot "itop-tls-init".
  vars.itop_containers        = [ "^itop$$", "^itop-mariadb$$", "^itop-tls$$" ]
  vars.itop_healthy_container = [ "^itop-mariadb$$" ]

  // Set to false on an instance where the cron container is not deployed.
  vars.itop_cron_container_enabled = true

  // --- Mail ---
  vars.itop_mail_config           = "/data/itop/conf/production/config-itop.php"
  vars.itop_mail_expect_transport = "SMTP"
  vars.itop_mail_forbid_hosts     = [ "mailpit", "localhost", "127.0.0.1" ]

  // --- Synchro replica baselines ---
  // Empty by default: baselines must be read from the instance and recorded
  // deliberately. See servicesets/itop/README.md before setting these.
  // vars.itop_replica_errors_baseline       = "1=39,2=132"
  // vars.itop_replica_errors_ignore_sources = "5,6,15,16"
}
