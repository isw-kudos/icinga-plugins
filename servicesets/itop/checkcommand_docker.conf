// check_docker - CheckCommand Definition (third-party plugin)
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: servicesets/itop/README.md
// Minimum Icinga 2 version: 2.13.0

// This wraps check_docker.py (Tim Laurence, v2.2.x), which is already deployed
// to PluginDir on agents in this estate. It is NOT a plugin from this
// repository - only this CheckCommand is. Install it only if your master does
// not already define a check_docker command.
//
// IMPORTANT: repeat_key is false on --containers, and must stay false.
// check_docker.py declares that option with argparse nargs='+', so it expects
//   --containers '^a$' '^b$'
// If Icinga repeated the key instead - "--containers a --containers b" -
// argparse would keep only the LAST value and silently monitor one container.
// Icinga's default for repeat_key is true, so leaving it out is a live bug.

object CheckCommand "check_docker" {
  command = [ PluginDir + "/check_docker" ]

  arguments = {
    "--containers" = {
      value       = "$check_docker_containers$"
      description = "Regexes matching container names; anchor them (e.g. '^itop$$')"
      repeat_key  = false
      required    = true
    }
    "--present" = {
      set_if      = "$check_docker_present$"
      description = "Each regex must match at least one container - catches a container that has gone missing"
    }
    "--status" = {
      value       = "$check_docker_status$"
      description = "Desired container status, e.g. running"
    }
    "--health" = {
      set_if      = "$check_docker_health$"
      description = "Check the container healthcheck. UNKNOWN when a container has no healthcheck, so scope this to containers that define one"
    }
    "--uptime" = {
      value       = "$check_docker_uptime$"
      description = "Minimum uptime in seconds as WARN:CRIT - the level-based way to catch a crash loop"
    }
    "--restarts" = {
      value       = "$check_docker_restarts$"
      description = "Restart count thresholds as WARN:CRIT"
    }
    "--timeout" = {
      value       = "$check_docker_timeout$"
      description = "Timeout in seconds"
    }
    "--no-ok" = {
      set_if      = "$check_docker_no_ok$"
      description = "Suppress per-container OK lines"
    }
  }

  vars.check_docker_present = true
  vars.check_docker_status  = "running"
  vars.check_docker_health  = false
  vars.check_docker_timeout = 20
  vars.check_docker_no_ok   = false
}
