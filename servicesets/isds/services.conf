// ISDS Service Set - Service Definitions
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: servicesets/isds/README.md
// Minimum Icinga 2 version: 2.13.0

// The whole IBM Security Directory Server set in one file: four checks, all of
// them run on the agent on the SDS host.
//
// DEPLOY THIS *INSTEAD OF* the per-plugin service.conf files, not alongside
// them. Both define apply rules of the same name, and Icinga will refuse to
// start on the duplicate.
//
// Every rule assigns on host.vars.isds, set by the "isds-host" host template.

// ---------------------------------------------------------------------------
// 1. Server health from cn=monitor
// ---------------------------------------------------------------------------
// Worker pool, connections, throughput and cache hit ratios. The worker pool
// is what catches a server that still accepts TCP connections but answers
// nothing. Cache hit-ratio alerting is off unless isds_monitor_cache_warn /
// _crit are set on the host - filter caches legitimately run around 40%.
apply Service "isds-monitor" {
  import "isds-monitor"

  vars.isds_monitor_host     = host.vars.isds_ldap_host
  vars.isds_monitor_port     = host.vars.isds_ldap_port
  vars.isds_monitor_binddn   = host.vars.isds_ldap_binddn
  vars.isds_monitor_passfile = host.vars.isds_ldap_passfile

  assign where host.vars.isds == true
}

// ---------------------------------------------------------------------------
// 2. Replication agreements
// ---------------------------------------------------------------------------
// Apply this to EVERY server in a replication topology, not just one. The
// operational state of an agreement - replication state, pending changes,
// last change id - is only published on the supplier side. On the consumer
// side the check reports an informational OK. In a peer pair each server is
// the supplier for one direction, so only checking both sees both directions.
apply Service "isds-replication" {
  import "isds-replication"

  vars.isds_repl_host     = host.vars.isds_ldap_host
  vars.isds_repl_port     = host.vars.isds_ldap_port
  vars.isds_repl_binddn   = host.vars.isds_ldap_binddn
  vars.isds_repl_passfile = host.vars.isds_ldap_passfile
  vars.isds_repl_base     = host.vars.isds_repl_base

  assign where host.vars.isds == true
}

// ---------------------------------------------------------------------------
// 3. Processes and the DB2 backend
// ---------------------------------------------------------------------------
// ibmslapd, ibmdiradm and db2sysc are running; DB2 tablespaces and the
// transaction log are not filling. Requires the check_isds_backend command to
// run through sudo - see README.md.
apply Service "isds-backend" {
  import "isds-backend"

  vars.isds_backend_db2_instance = host.vars.isds_backend_db2_instance
  vars.isds_backend_db2_database = host.vars.isds_backend_db2_database
  vars.isds_backend_db2_user     = host.vars.isds_backend_db2_user

  assign where host.vars.isds == true
}

// ---------------------------------------------------------------------------
// 4. Server certificate expiry
// ---------------------------------------------------------------------------
// Personal certificates only by default: server keystores also bundle CA
// roots, several of them long expired, which would otherwise alert forever.
apply Service "isds-cert" {
  import "isds-cert"

  vars.isds_cert_kdb   = host.vars.isds_cert_kdb
  vars.isds_cert_stash = host.vars.isds_cert_stash

  assign where host.vars.isds == true
}
