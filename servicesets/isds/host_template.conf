// ISDS Service Set - Host Template
// Part of: https://github.com/isw-kudos/icinga-plugins
// Docs: servicesets/isds/README.md
// Minimum Icinga 2 version: 2.13.0

// Importing this template turns on every service in the ISDS set and carries
// the settings they share. The LDAP connection is defined once, in
// isds_ldap_*, and used by both LDAP checks (monitor and replication).
//
// Override any of these per host after the import. The bind DN and the
// replication search base are placeholders and MUST be overridden.

template Host "isds-host" {
  check_command = "hostalive"

  // The single flag every service in the set assigns on.
  vars.isds = true

  // --- Shared LDAP connection (check_isds_monitor, check_isds_replication) ---
  // Both checks run on the agent on the SDS host, so they reach the server on
  // loopback rather than through $address$.
  vars.isds_ldap_host = "127.0.0.1"
  vars.isds_ldap_port = 389

  // A real, bindable service account with read access to cn=monitor and the
  // replication topology. Not "cn=monitor" itself: that is the search base,
  // not an entry you can bind as - binding to it fails with LDAP rc=48.
  vars.isds_ldap_binddn = "cn=icinga-monitor,cn=Users,cn=ServiceAccounts,dc=example,dc=com"

  // The password is NOT here. It lives in a mode 0400 file on the agent,
  // owned by the icinga user, referenced only by path.
  vars.isds_ldap_passfile = "/etc/icinga2/secrets/isds_monitor.pw"

  // --- Replication ---
  // The directory suffix holding the replication agreements.
  vars.isds_repl_base = "dc=example,dc=com"

  // --- DB2 backend ---
  // The DB2 instance, database and instance owner behind the directory.
  // Running DB2 as the owner needs root - see the sudoers step in README.md.
  vars.isds_backend_db2_instance = "idsldap"
  vars.isds_backend_db2_database = "IDSLDAP"
  vars.isds_backend_db2_user     = "idsldap"

  // --- Server certificate ---
  // The keystore the server presents, per ibm-slapdSslKeyDatabase in
  // ibmslapd.conf - NOT the client-side CA keystore under the LDAP install dir.
  vars.isds_cert_kdb   = "/data/idsldap/ssl/keystore.kdb"
  vars.isds_cert_stash = "/data/idsldap/ssl/keystore.sth"
}
